# Production compose file. No host ports are published: put a reverse proxy in front
# that routes your domain to port 3000 (or attach it to the proxy's network).
# For local use, run `docker compose -f docker-compose.yml -f docker-compose.local.yml up`.
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Only used by Coolify (generates a domain routed to port 3000); ignored elsewhere.
      - SERVICE_FQDN_APP_3000
      # Base URL for QR codes / join links, e.g. https://bracket.example.com.
      # Falls back to Coolify's generated domain, then to the request host.
      - PUBLIC_URL=${PUBLIC_URL:-${SERVICE_FQDN_APP:-}}
      # Optional: require this password to create rooms (joining stays open).
      - HOST_PASSWORD=${HOST_PASSWORD:-}
      - PORT=3000
      - DATA_DIR=/data
      - ROOM_TTL_HOURS=${ROOM_TTL_HOURS:-6}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-5}
      - MAX_ROOMS=${MAX_ROOMS:-200}
      - MAX_PLAYERS_PER_ROOM=${MAX_PLAYERS_PER_ROOM:-100}
    volumes:
      - bracket-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  bracket-data:
